[project]
name = "utility-agent-genaiops"
version = "1.0.0"
description = "A customer-service agent for an energy utility, run the GenAIOps way on Azure"
requires-python = ">=3.11"
dependencies = [
  "numpy>=1.26",
  "scikit-learn>=1.4",
  "pydantic>=2.6",
  "fastapi>=0.110",
  "httpx>=0.27",
  "opentelemetry-sdk>=1.25",
]

[project.optional-dependencies]
azure = ["azure-monitor-opentelemetry-exporter>=1.0.0b25"]
dev = ["pytest>=8", "ruff>=0.6", "uvicorn>=0.29"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]
ignore = ["B008"]
